name: evaluate-models

# Static cross-platform contract checks; runs the real evaluation pipeline
# only when trained artifacts and datasets are present (e.g. on a runner
# where they were produced beforehand).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kotlin/manifest/assets contract check
        run: python scripts/check_android_consistency.py

  full-eval:
    runs-on: ubuntu-latest
    if: hashFiles('ml/checkpoints/srm_cnn_genimage_best.pth') != ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r ml/requirements.txt
          python -m pip install -e ml

      - name: Run honest held-out evaluation
        working-directory: ml
        run: python scripts/run_full_pipeline.py

      - name: Upload metrics
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: ml/evaluation_results.json
