name: evaluate-models

on:
  push:
    branches: [main, 'review/**']
  pull_request:
  workflow_dispatch:
    inputs:
      training_run_id:
        description: 'Completed train-models run ID whose onn-model-release artifact should be verified'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install pinned CPU training and conversion dependencies
        run: |
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r ml/requirements.txt -r ml/requirements-export.txt -r ml/requirements-dev.txt
          python -m pip install --no-deps -e ml
      - name: Required contracts and full conversion gates
        env:
          ONN_REQUIRE_REAL_AUDIO_IO: '1'
        run: |
          python onn_release_lineage_gate.py --repo .
          python scripts/check_android_consistency.py
          python -m unittest discover -s scripts/tests -v
          python -m unittest discover -s ml/tests -p 'test_*.py' -v
          python -m unittest discover -s tests -p 'tier5_adversarial_stress_test.py' -v
          python tests/e2e/run_e2e_tests.py
          python ml/src/models/prism_v11_algorithms.py --self-test
          python ml/scripts/train_srm_dcpt_patchcraft.py --self-test
          python ml/scripts/train_bfree_tap_and_ssl_distill.py --self-test
          python ml/scripts/train_forensic_vlm_colab_t4.py --self-test
          python scripts/verify_front_end_parity.py --require-torch
          python scripts/gen_lfcc_golden.py --torch --check scripts/lfcc_golden.json
          python scripts/verify_fft_parity.py
          python scripts/verify_export_path.py --full

      - name: Validate workflow syntax and pinned actions
        run: python scripts/verify_workflow_syntax.py

  verify-training-artifact:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Fetch the explicit training run, not ignored local checkpoints
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: onn-model-release
          path: training-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.training_run_id }}
      - name: Verify bundle lineage (this does not rerun accuracy evaluation)
        run: python ml/scripts/release_bundle.py --bundle training-artifact/bundle --validate-only
