name: build-android

on:
  push:
    branches: [main, 'review/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          log-accepted-android-sdk-licenses: true
      # The Python contract checks below are stdlib-only, but running them on an
      # unpinned runner image made the interpreter version an unstated variable.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install Python contract check dependencies
        run: python -m pip install numpy==2.3.5 PyYAML==6.0.2 "cryptography>=50.0.2"
      - name: Source and release contract checks
        run: |
          python scripts/check_android_consistency.py
          python scripts/verify_workflow_syntax.py
          python -m unittest discover -s scripts/tests -v
      - name: Unit tests, lint, debug and minified release
        working-directory: android
        run: bash gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease assembleDebugAndroidTest --no-daemon
      - name: Verify actual APK permissions, hashes and 16 KiB support
        run: |
          python scripts/verify_android_artifact.py --apk android/app/build/outputs/apk/debug/app-debug.apk
          # The release build type has been debug-signed since c5c3f4a, so
          # Gradle emits app-release.apk rather than app-release-unsigned.apk.
          # Accept either name so the gate does not depend on the signing
          # configuration, but require one of them to exist.
          RELEASE_APK=""
          for candidate in app-release.apk app-release-unsigned.apk; do
            if [ -f "android/app/build/outputs/apk/release/$candidate" ]; then
              RELEASE_APK="android/app/build/outputs/apk/release/$candidate"
              break
            fi
          done
          if [ -z "$RELEASE_APK" ]; then
            echo "No release APK found in android/app/build/outputs/apk/release/" >&2
            exit 1
          fi
          python scripts/verify_android_artifact.py --apk "$RELEASE_APK"
      - name: Upload diagnostics (models remain explicitly unvalidated)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-build-diagnostics
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.html
            android/app/build/outputs/mapping/release/

  # Separate job rather than a step in `build`: the emulator needs no JDK/SDK
  # work from the build job and a hung emulator must not consume build minutes.
  instrumentation:
    # The four instrumentation classes (AppFlow, PackagedInference,
    # HistoryMigration, ProviderImport) were previously only COMPILED here via
    # assembleDebugAndroidTest and never executed. Run them on an API 36
    # emulator.
    #
    # LIMITS, stated rather than hidden:
    #  * An emulator is not a phone. This catches regressions; it does not
    #    establish codec, bitmap, performance or thermal behaviour on hardware.
    #  * A hosted emulator's page size is not guaranteed to be 16 KiB. The
    #    16 KiB evidence remains the ELF/ZIP APK gate plus device measurement.
    #  * Requires nested virtualization (/dev/kvm) on the runner.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          log-accepted-android-sdk-licenses: true
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: 36
          target: default
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          heap-size: 576M
          emulator-boot-timeout: 900
          disable-snapshot: true
          disable-animations: true
          emulator-options: -no-snapshot -no-boot-anim -gpu swiftshader_indirect -no-snapshot-save -no-audio -no-window
          script: cd android && bash gradlew connectedDebugAndroidTest --no-daemon
      - name: Upload instrumentation results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-instrumentation
          if-no-files-found: error
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
