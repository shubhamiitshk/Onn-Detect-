# Fusion v2 Configuration — 16-feature schema with MLLM integration
#
# This config extends the original 10-feature XGBoost fusion with
# 6 new features from the on-device MLLM (Gemma 3n E2B) scorer.
#
# Expected AUC improvement: 0.592 → 0.72-0.78 (conservative estimate)
# Research basis: MoA-DF (ACM MM 2025), DFBench, Veritas (2025)

fusion_v2:
  # Feature schema (16 features)
  feature_names:
    # Original 10 features
    - srm_score              # [0] SRM CNN P(ai)
    - fft_score              # [1] FFT spectral slope deviation
    - kl_score               # [2] KL divergence of diff histogram
    - flatness_score         # [3] Wiener entropy of power spectrum
    - resolution_norm        # [4] min(w,h)/1024
    - is_compressed          # [5] 1.0 if JPEG
    - exif_anomaly           # [6] fixed 0.1 (unverified)
    - c2pa_present           # [7] fixed 0.05 (unverified)
    - lip_sync_corr          # [8] fixed 0.9 (unverified)
    - landmark_jitter        # [9] fixed 0.1 (unverified)
    # New MLLM features
    - mllm_score             # [10] MLLM P(ai) from token logprobs
    - mllm_confidence        # [11] MLLM self-confidence (0/0.5/1)
    - mllm_anomaly_count    # [12] Number of semantic anomalies detected
    - modality_agreement     # [13] SRM-MLLM agreement score [0,1]
    - srm_entropy            # [14] SRM prediction entropy
    - lcnn_entropy           # [15] LCNN prediction entropy

  # XGBoost parameters
  xgboost:
    objective: binary:logistic
    max_depth: 4                # Was 3 in v1 — deeper for more features
    eta: 0.05                   # Was 0.1 — lower LR for more trees
    n_estimators: 200           # Was 40 — more trees for richer model
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 3
    gamma: 0.1
    seed: 42
    early_stopping_rounds: 15

  # Per-model calibration
  calibration:
    method: platt_scaling       # Platt (1999), Guo et al. (2017)
    srm:
      fitted: false
      a: 1.0
      b: 0.0
    mllm:
      fitted: false
      a: 1.0
      b: 0.0

  # Shortcut blocking (neutralize container features)
  block_shortcuts:
    enabled: true
    neutralize_features: [4, 5]  # resolution_norm, is_compressed
    neutral_values: [0.5, 1.0]

  # MLLM configuration
  mllm:
    model_id: google/gemma-3n-E2B-it
    device: cpu
    dtype: bfloat16
    load_in_4bit: false
    max_new_tokens: 512
    temperature: 0.1
    prompt_template: forensic_image

  # Evaluation
  evaluation:
    metrics:
      - auc
      - eer
      - accuracy
      - balanced_accuracy
      - brier_score
      - log_loss
      - tpr_at_fpr_1pct
      - tpr_at_fpr_0.1pct
    confidence_intervals:
      method: wilson
      alpha: 0.05
    subgroup_analysis:
      enabled: true
      by_source: true
      by_generator: true

  # Export
  export:
    kotlin_package: com.onndetect.detection.fusion
    kotlin_class: FusionV2Classifier
    validate_parity: true
    parity_tolerance: 1.0e-4
