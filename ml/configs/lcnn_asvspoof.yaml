model:
  name: LCNNMFMAudio
  input_size:
  - 401
  - 40
  num_classes: 1
data:
  dataset: asvspoof2019
  root_dir: ../datasets/asvspoof2019
  max_duration: 4.0
  sample_rate: 16000
  cache_in_memory: false
training:
  epochs: 30
  batch_size: 16
  num_workers: 0
  prefetch_factor: 2
  amp: true
  precision: fp16
  gradient_clip: 1.0
optimizer:
  name: AdamW
  lr: 0.0008
  weight_decay: 0.0002
scheduler:
  name: CosineAnnealing
  warmup_epochs: 5
  T_max: 30
  eta_min: 1.0e-07
early_stopping:
  patience: 7
  metric: val_eer
  mode: min
logging:
  log_dir: ../ml/logs
  save_interval: 5
