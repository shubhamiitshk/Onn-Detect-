model:
  name: SRMForensicCNN
  input_size: 128
  num_classes: 1
data:
  dataset: openfake
  root_dir: ../datasets/openfake_visual
  img_size: 128
  cache_in_memory: true
  cache_bytes: 536870912
training:
  epochs: 18
  batch_size: 32
  num_workers: 0
  prefetch_factor: 2
  amp: false
  precision: fp32
  gradient_clip: 1.0
optimizer:
  name: AdamW
  lr: 0.001
  weight_decay: 0.0002
scheduler:
  name: CosineAnnealing
  warmup_epochs: 2
  T_max: 18
  eta_min: 1.0e-06
early_stopping:
  patience: 6
  metric: val_auc
  mode: max
logging:
  log_dir: ../ml/logs
  save_interval: 5

