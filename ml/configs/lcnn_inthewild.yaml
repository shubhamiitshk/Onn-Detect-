model:
  name: LCNNMFMAudio
  input_size:
  - 401
  - 40
  num_classes: 1
data:
  dataset: inthewild_audio
  root_dir: ../datasets/inthewild_audio
  max_duration: 4.0
  sample_rate: 16000
  cache_in_memory: false
training:
  epochs: 35
  batch_size: 16
  num_workers: 0
  prefetch_factor: 2
  amp: true
  precision: fp16
  gradient_clip: 1.0
optimizer:
  name: AdamW
  lr: 8.0e-05
  weight_decay: 0.0001
scheduler:
  name: CosineAnnealing
  warmup_epochs: 4
  T_max: 35
  eta_min: 1.0e-07
early_stopping:
  patience: 8
  metric: val_eer
  mode: min
logging:
  log_dir: ../ml/logs
  save_interval: 5
