model:
  name: LCNNMFMAudio
  input_size: [400, 40] # LFCC frames, n_lfcc
  num_classes: 1

data:
  dataset: inthewild_audio
  root_dir: ../datasets/inthewild_audio
  max_duration: 4.0
  sample_rate: 16000
  cache_in_memory: true

training:
  epochs: 35
  batch_size: 64
  num_workers: 4
  prefetch_factor: 2
  amp: true
  precision: fp16
  gradient_clip: 1.0

optimizer:
  name: AdamW
  lr: 0.00008           # Fine-tuned learning rate for In-The-Wild vocoders
  weight_decay: 0.0001

scheduler:
  name: CosineAnnealing
  warmup_epochs: 4
  T_max: 35
  eta_min: 0.0000001

early_stopping:
  patience: 8
  metric: val_eer
  mode: min

logging:
  log_dir: ../ml/logs
  save_interval: 5
