model:
  name: SRMForensicCNN
  input_size: 32
  num_classes: 1
data:
  dataset: cifake
  root_dir: ../datasets/cifake
  img_size: 32
  cache_in_memory: false
training:
  epochs: 20
  batch_size: 16
  num_workers: 0
  prefetch_factor: 2
  amp: true
  precision: fp16
  gradient_clip: 1.0
optimizer:
  name: AdamW
  lr: 0.001
  weight_decay: 0.0001
scheduler:
  name: CosineAnnealing
  warmup_epochs: 3
  T_max: 20
  eta_min: 1.0e-06
early_stopping:
  patience: 5
  metric: val_auc
  mode: max
logging:
  log_dir: ../ml/logs
  save_interval: 5
